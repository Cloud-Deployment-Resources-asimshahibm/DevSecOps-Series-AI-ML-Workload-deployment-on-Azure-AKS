clusterName: ml-ray
rayVersion: "2.40.0"

image:
  repository: ""      # <acr>.azurecr.io/aiml/ml-ray (set by Argo CD from Terraform outputs)
  tag: "bootstrap"    # bumped by CI
  digest: ""          # sha256:... (signed) — preferred when set

serviceAccount:
  name: ray-worker
  clientId: ""        # Workload ID aiml-<env>-ml-training (Blob data/models/artifacts), set by Argo CD

storage:
  # Shared RWX scratch on Azure Files NFS for checkpoints / datasets
  scratch:
    enabled: true
    size: 100Gi
    storageClass: azurefile-nfs

head:
  resources:
    requests: { cpu: "2", memory: 8Gi }
    limits: { cpu: "2", memory: 8Gi }
  nodeSelector:
    workload: ml-cpu

workerGroups:
  - name: cpu
    replicas: 0
    minReplicas: 0
    maxReplicas: 8
    resources:
      requests: { cpu: "4", memory: 16Gi }
      limits: { cpu: "4", memory: 16Gi }
    nodeSelector:
      workload: ml-cpu
    tolerations: []
  - name: gpu
    replicas: 0
    minReplicas: 0
    maxReplicas: 2
    resources:
      requests: { cpu: "3", memory: 12Gi, nvidia.com/gpu: 1 }
      limits: { cpu: "3", memory: 12Gi, nvidia.com/gpu: 1 }
    nodeSelector:
      workload: ml-gpu
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule

autoscaler:
  idleTimeoutSeconds: 120
  upscalingMode: Default
